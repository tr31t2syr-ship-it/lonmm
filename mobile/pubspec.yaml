name: lonm
description: Lonm - Movies, Series, and Animation Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  get: ^4.6.5
  flutter_screenutil: ^5.9.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.2.0
  
  # Authentication
  google_sign_in: ^6.1.4
  firebase_auth: ^4.7.0
  
  # Database & Storage
  firebase_core: ^2.13.0
  firebase_database: ^10.1.0
  hive: ^2.2.3
  
  # State Management
  provider: ^6.0.7
  
  # Utilities
  intl: ^0.18.1
  cached_network_image: ^3.2.3
  video_player: ^2.7.0
  
  # Local Storage
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
